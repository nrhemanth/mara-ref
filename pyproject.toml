[project]
name = "mara"
version = "0.1.0"
description = "Remote control and automation of mara with datalab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datalab-api ~= 0.5",
    "opentrons ~= 8.8",
    "httpx ~= 0.28",
    "pydantic ~= 2.0",
    "fastapi ~= 0.116",
    "uvicorn[standard] ~= 0.32",
    "python-multipart ~= 0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara"]

[dependency-groups]
dev = [
    "pytest ~= 9.0",
    "pytest-cov ~= 7.1",
    "pytest-httpx ~= 0.35",
    "pre-commit ~= 4.6",
]

[project.scripts]
mara-mock-robot = "mara.mock_robot:main"
